name: Build & Release

# Builds QForge from QForge.spec (the same spec build.sh uses locally).
# Pushing a `vX.Y.Z` tag publishes a GitHub Release with the built
# artifact(s) attached — always built fresh from that exact tagged commit on
# a clean runner, so a stale local checkout can never get published under
# the wrong tag again. Also pushes the corresponding Homebrew tap update
# (see the update-homebrew-tap job below).
#
# Windows/Linux legs only actually run once CROSS_PLATFORM_SUPPORTED is
# flipped to 'true' below — until then this only builds/releases macOS,
# since Windows/Linux aren't verified-supported yet (see Tier 2 of the
# product roadmap in the plans referenced from ai/flush-context.md).
#
# "Run workflow" (workflow_dispatch) lets you validate the build matrix on
# any branch without cutting a real release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  # Windows/Linux aren't actually supported yet (no path unification via
  # utils/paths.py, no per-OS verification — see Tier 2 of the product
  # roadmap). Building and publishing installers for them would imply
  # support that doesn't exist. Flip to 'true' once that's done.
  CROSS_PLATFORM_SUPPORTED: 'false'

jobs:
  # Computes which OS legs the build matrix should actually include. A
  # job-level `if:` can't reference `matrix` (only github/needs/vars/inputs
  # are available there), so gating individual matrix entries has to happen
  # by controlling what goes into the matrix itself, via this job's output,
  # rather than trying to skip matrix entries with a job-level condition.
  determine-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ env.CROSS_PLATFORM_SUPPORTED }}" = "true" ]; then
            echo 'matrix=[{"os":"macos-latest","artifact_name":"QForge.dmg"},{"os":"windows-latest","artifact_name":"QForge-windows.zip"},{"os":"ubuntu-latest","artifact_name":"QForge-linux.tar.gz"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"os":"macos-latest","artifact_name":"QForge.dmg"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: determine-platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # PySide6 needs a handful of shared libraries present to even import
      # cleanly on a bare Ubuntu runner (no desktop environment installed).
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean QForge.spec

      - name: Package macOS app (prune Qt frameworks, ad-hoc sign, create DMG)
        if: runner.os == 'macOS'
        run: |
          QT_LIB_DIR="dist/QForge.app/Contents/Frameworks/PySide6/Qt/lib"
          for fw in QtQml QtQuick QtQuick3D QtQmlModels QtQmlMeta QtQmlWorkerScript \
                    QtPdf QtPdfWidgets QtVirtualKeyboard QtVirtualKeyboardQml QtOpenGL; do
            rm -rf "$QT_LIB_DIR/${fw}.framework"
            rm -f "dist/QForge.app/Contents/Frameworks/${fw}" \
                  "dist/QForge.app/Contents/Resources/${fw}"
          done
          # Ad-hoc signature only (no Apple Developer ID / notarization
          # configured) — matches build.sh's local behavior. Users still see
          # a Gatekeeper prompt on first launch; see README.
          codesign --force --deep -s - dist/QForge.app
          hdiutil create -volname "QForge" -srcfolder dist/QForge.app -ov -format UDZO "${{ matrix.artifact_name }}"

      - name: Package Windows build (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/QForge/* -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package Linux build (tarball)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact_name }}" -C dist QForge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        working-directory: artifacts
        run: sha256sum ./* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "QForge ${GITHUB_REF_NAME}" \
            --notes "Automated release built from commit ${{ github.sha }}. Verify downloads against SHA256SUMS.txt." \
            --generate-notes \
            artifacts/*

  # Bumps adarshags/homebrew-qforge's Casks/qforge.rb to this tag's version
  # and the just-published QForge.dmg's real sha256, so `brew upgrade --cask
  # qforge` picks up the new release without a manual step. Needs a
  # HOMEBREW_TAP_TOKEN repo secret (a fine-grained PAT scoped to Contents:
  # Read and write on adarshags/homebrew-qforge only) — see README/deploy.sh
  # for setup. If the secret isn't set, this job warns and exits cleanly
  # rather than failing the release.
  update-homebrew-tap:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap cask
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping Homebrew tap update. Update Casks/qforge.rb in adarshags/homebrew-qforge manually (see deploy.sh)."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_SHA256=$(curl -sL "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS.txt" | awk '/QForge\.dmg$/ {print $1}')
          if [ -z "$DMG_SHA256" ]; then
            echo "::error::Could not determine QForge.dmg sha256 from the release's SHA256SUMS.txt"
            exit 1
          fi

          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/AdarshaGS/homebrew-qforge.git" tap
          cd tap
          sed -i "s/  version \".*\"/  version \"${VERSION}\"/" Casks/qforge.rb
          sed -i "s/  sha256 \".*\"/  sha256 \"${DMG_SHA256}\"/" Casks/qforge.rb

          if git diff --quiet; then
            echo "Cask already up to date — nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/qforge.rb
          git commit -m "qforge ${VERSION}"
          git push origin HEAD
