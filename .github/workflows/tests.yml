name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A growing share of the suite (schema diff/migration, data diff, ERD,
    # export worker, generated columns, stream_table_rows, schema snapshot,
    # schema cache invalidation, query cost) runs against a real Postgres
    # server instead of the sqlite fixture these used before sqlite support
    # was removed from the app — those suites already self-skip when no
    # server matching these credentials is reachable, so without this
    # service they'd silently stop running in CI rather than fail loudly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qforge_test
          POSTGRES_PASSWORD: qforge_test_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # PySide6's "offscreen" QPA plugin (which the Qt-touching tests select
      # via QT_QPA_PLATFORM=offscreen) still dynamically links libEGL/libGL
      # and a handful of xcb/dbus libs for its software rendering path.
      # ubuntu-latest's default image dropped these, which started failing
      # every run at test *collection* (ImportError on `from PySide6...`)
      # from 2026-08-17 on — before pytest could run a single test, and
      # before the bandit step below ever got a chance to execute.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libnss3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Issue #140: SAST for QForge's own source (injection patterns,
      # hardcoded-secret-shaped strings, unsafe eval/subprocess use, ...) —
      # distinct from #120's dependency-CVE scanning. Config (skips, exclude
      # dirs) lives in pyproject.toml's [tool.bandit]; baseline findings are
      # individually triaged with justified `# nosec` comments referencing
      # tracked follow-up issues where relevant, so this fails on anything
      # *new*, not on the audited-clean baseline.
      - name: Run bandit (static security analysis)
        run: bandit -c pyproject.toml -r . -x ./tests,./venv,./build,./dist,./graphify-out

      # Issue #120: catch known CVEs in pinned third-party dependencies
      # (PySide6, cryptography, paramiko/sshtunnel, psycopg2, pandas, ...)
      # before they ship in a release. Distinct from bandit above, which
      # scans QForge's own source rather than dependency advisories.
      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit -r requirements.txt
