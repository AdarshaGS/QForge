[project]
name = "qforge"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # line length handled by formatter/reviewer judgment, not a hard fail
]

[tool.ruff.format]
quote-style = "double"
